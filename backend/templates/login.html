{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<h2>CyberShield Login</h2>

<form method="POST">

    <p>
        <label>Username</label><br>
        <input type="text" name="username" required>
    </p>

    <p>
        <label>Password</label><br>
        <input type="password" name="password" required>
    </p>

    <p>
        <button type="submit">
            Login
        </button>
    </p>

</form>

{% endblock %}
